version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint's peer range is `typescript <6.1.0` and it throws at load
      # under TS 7, which fails `pnpm lint` for the whole grouped PR. Drop this once
      # typescript-eslint supports TS 7 (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: America/Chicago
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
