name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_NAME: sawdust-atlas

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack prepare pnpm@11.5.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack prepare pnpm@11.5.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

  docker-verify:
    name: Docker verify
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so the build-number commit count is real

      - name: Build provenance
        id: prov
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "number=$(git rev-list --count HEAD)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "branch=${REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          build-args: |
            BUILD_ENV=production
            BUILD_NUMBER=${{ steps.prov.outputs.number }}
            BUILD_SHA=${{ steps.prov.outputs.sha }}
            BUILD_BRANCH=${{ steps.prov.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the served image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
        run: |
          docker run -d --name sawdust-ci -p 8080:80 "$IMAGE_REF"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          echo "Root document:"
          curl -fsS -o /dev/null -w '  HTTP %{http_code}\n' http://127.0.0.1:8080/
          echo "Deep link (SPA fallback to index.html):"
          curl -fsS -o /dev/null -w '  HTTP %{http_code}\n' http://127.0.0.1:8080/boards/unknown-id
          echo "Security headers present:"
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ \
            | grep -iE 'content-security-policy|x-content-type-options|x-frame-options' \
            || { echo "expected security headers missing"; docker logs sawdust-ci; docker rm -f sawdust-ci; exit 1; }
          docker rm -f sawdust-ci

      - name: Scan local Docker image
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        continue-on-error: true
        with:
          command: cves,recommendations
          image: local://${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          only-severities: critical,high
          write-comment: false

  docker-publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so the build-number commit count is real

      - name: Build provenance
        id: prov
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "number=$(git rev-list --count HEAD)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "branch=${REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Check Docker Hub credentials
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish Docker images."
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_ENV=production
            BUILD_NUMBER=${{ steps.prov.outputs.number }}
            BUILD_SHA=${{ steps.prov.outputs.sha }}
            BUILD_BRANCH=${{ steps.prov.outputs.branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan published Docker image
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        continue-on-error: true
        with:
          command: cves,recommendations
          image: registry://${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          only-severities: critical,high
          write-comment: false
