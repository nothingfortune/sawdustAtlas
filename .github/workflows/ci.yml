name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_NAME: sawdust-atlas

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack prepare pnpm@11.5.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack prepare pnpm@11.5.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

  docker-verify:
    name: Docker verify
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so the build-number commit count is real

      - name: Build provenance
        id: prov
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "number=$(git rev-list --count HEAD)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "branch=${REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          build-args: |
            BUILD_ENV=production
            BUILD_NUMBER=${{ steps.prov.outputs.number }}
            BUILD_SHA=${{ steps.prov.outputs.sha }}
            BUILD_BRANCH=${{ steps.prov.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the served image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          CONTAINER: sawdust-ci
        run: |
          docker run -d --name "$CONTAINER" -p 8080:8080 "$IMAGE_REF"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          echo "Root document:"
          curl -fsS -o /dev/null -w '  HTTP %{http_code}\n' http://127.0.0.1:8080/
          echo "Deep link (SPA fallback to index.html):"
          curl -fsS -o /dev/null -w '  HTTP %{http_code}\n' http://127.0.0.1:8080/boards/unknown-id
          echo "Security headers present:"
          for h in content-security-policy x-content-type-options x-frame-options; do
            curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ | grep -qi "^$h:" \
              || { echo "missing $h"; docker logs "$CONTAINER"; docker rm -f "$CONTAINER"; exit 1; }
            echo "  $h: present"
          done
          docker rm -f "$CONTAINER"

      - name: Scan image for vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker-verify

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  docker-publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so the build-number commit count is real

      - name: Build provenance
        id: prov
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "number=$(git rev-list --count HEAD)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "branch=${REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish Docker images."
            exit 1
          fi

      - name: Build amd64 image for verification
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:publish-ci-${{ github.run_id }}
          build-args: |
            BUILD_ENV=production
            BUILD_NUMBER=${{ steps.prov.outputs.number }}
            BUILD_SHA=${{ steps.prov.outputs.sha }}
            BUILD_BRANCH=${{ steps.prov.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:publish-ci-${{ github.run_id }}
          CONTAINER: sawdust-publish-ci
        run: |
          docker run -d --name "$CONTAINER" -p 8080:8080 "$IMAGE_REF"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          echo "Root document:"
          curl -fsS -o /dev/null -w '  HTTP %{http_code}\n' http://127.0.0.1:8080/
          echo "Deep link (SPA fallback to index.html):"
          curl -fsS -o /dev/null -w '  HTTP %{http_code}\n' http://127.0.0.1:8080/boards/unknown-id
          echo "Security headers present:"
          for h in content-security-policy x-content-type-options x-frame-options; do
            curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ | grep -qi "^$h:" \
              || { echo "missing $h"; docker logs "$CONTAINER"; docker rm -f "$CONTAINER"; exit 1; }
            echo "  $h: present"
          done
          docker rm -f "$CONTAINER"

      - name: Scan image for vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:publish-ci-${{ github.run_id }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker-publish

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:publish-ci-${{ github.run_id }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_ENV=production
            BUILD_NUMBER=${{ steps.prov.outputs.number }}
            BUILD_SHA=${{ steps.prov.outputs.sha }}
            BUILD_BRANCH=${{ steps.prov.outputs.branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
